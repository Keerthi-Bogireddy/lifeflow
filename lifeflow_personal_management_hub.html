              <span class="block mb-1">Notes</span>
              <textarea data-period-notes rows="2" placeholder="Optional details for ${escapeHTML(dayLabel)}..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-normal">${escapeHTML(detail.notes || '')}</textarea>
            </label>
          </section>
        `;
      }).join('');
    }

    function collectPeriodDayDetails(container) {
      return Array.from(container.querySelectorAll('[data-period-day]')).map(day => ({
        date: day.getAttribute('data-period-day'),
        flow: day.querySelector('[data-period-flow]').value,
        symptoms: Array.from(day.querySelectorAll('[data-period-symptom]:checked')).map(input => input.value),
        notes: day.querySelector('[data-period-notes]').value.trim()
      }));
    }

    function renderPeriod(container) {
      const pred = getPeriodPrediction();
      const now = new Date();
      const viewDate = new Date(now.getFullYear(), now.getMonth() + state.period.viewMonthOffset, 1);
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const monthName = viewDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      const firstDayIdx = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = todayISO();
      const editingLog = uiState.editingPeriodId
        ? state.period.logs.find(log => log.id === uiState.editingPeriodId)
        : null;
      const formStartDate = editingLog ? editingLog.startDate : today;
      const formEndDate = editingLog ? (editingLog.endDate || formStartDate) : addDaysISO(today, 4);
      const initialDailyDetails = getPeriodDailyDetails(editingLog);
      const symptomsList = getCategoryOptions('periodSymptoms');

      // Build day status lookup
      const loggedDays = new Set();
      state.period.logs.forEach(log => {
        let cur = log.startDate;
        const end = log.endDate || addDaysISO(log.startDate, pred.periodLen - 1);
        let guard = 0;
        while (cur <= end && guard < 20) {
          loggedDays.add(cur);
          cur = addDaysISO(cur, 1);
          guard++;
        }
      });

      const predictedDays = new Set();
      if (pred.nextStart) {
        for (let i = 0; i < pred.periodLen; i++) {
          predictedDays.add(addDaysISO(pred.nextStart, i));
        }
      }

      const fertileDays = new Set();
      if (pred.fertileStart && pred.fertileEnd) {
        let cur = pred.fertileStart;
        let guard = 0;
        while (cur <= pred.fertileEnd && guard < 12) {
          fertileDays.add(cur);
          cur = addDaysISO(cur, 1);
          guard++;
        }
      }

      let calCells = '';
      for (let i = 0; i < firstDayIdx; i++) {
        calCells += `<div class="h-10"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isLogged = loggedDays.has(iso);
        const isPredicted = predictedDays.has(iso);
        const isOvulation = iso === pred.ovulationDay;
        const isFertile = fertileDays.has(iso);
        const isToday = iso === today;

        let cellClass = 'bg-slate-50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300';
        if (isLogged) cellClass = 'bg-rose-500 text-white font-bold shadow-sm';
        else if (isPredicted) cellClass = 'bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 border border-dashed border-rose-400 font-semibold';
        else if (isOvulation) cellClass = 'bg-teal-500 text-white font-bold';
        else if (isFertile) cellClass = 'bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 border border-teal-200 dark:border-teal-800';

        calCells += `
          <div class="h-10 rounded-xl flex items-center justify-center text-xs relative ${cellClass} ${isToday ? 'ring-2 ring-indigo-500 ring-offset-1 dark:ring-offset-slate-900' : ''}">
            ${d}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="space-y-6">
          <!-- Cycle Insights -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div class="text-xs font-semibold uppercase text-slate-500">Current Cycle Day</div>
              <div class="text-2xl font-bold text-rose-600 dark:text-rose-400 mt-2 tabular-nums">${pred.cycleDay ? `Day ${pred.cycleDay}` : '—'}</div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div class="text-xs font-semibold uppercase text-slate-500">Next Predicted Period</div>
              <div class="text-xl font-bold mt-2 tabular-nums">${pred.nextStart || 'Log a period'}</div>
              <div class="text-xs text-slate-500 mt-0.5">${pred.daysUntil !== null ? `In ${pred.daysUntil} day${pred.daysUntil === 1 ? '' : 's'}` : ''}</div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div class="text-xs font-semibold uppercase text-slate-500">Estimated Fertile Window</div>
              <div class="text-sm font-bold text-teal-600 dark:text-teal-400 mt-2 tabular-nums">${pred.fertileStart ? `${pred.fertileStart} to ${pred.fertileEnd}` : '—'}</div>
              <div class="text-xs text-slate-500 mt-0.5">${pred.ovulationDay ? `Ovulation: ${pred.ovulationDay}` : ''}</div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-2">
              <div class="text-xs font-semibold uppercase text-slate-500">Cycle Settings (Days)</div>
              <div class="flex items-center gap-2">
                <label class="text-xs text-slate-500">Cycle:</label>
                <input id="cycle-len-input" type="number" min="18" max="45" value="${state.period.cycleLength}" class="w-14 px-2 py-1 text-xs font-bold rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
                <label class="text-xs text-slate-500">Period:</label>
                <input id="period-len-input" type="number" min="2" max="12" value="${state.period.periodLength}" class="w-14 px-2 py-1 text-xs font-bold rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
                <button id="save-cycle-settings" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white text-xs font-semibold hover:bg-rose-700">Save</button>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Calendar -->
            <div class="lg:col-span-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-base">${monthName}</h3>
                <div class="flex items-center gap-1">
                  <button id="period-prev-mo" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                  <button id="period-today-mo" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800">Today</button>
                  <button id="period-next-mo" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
              </div>
              <div class="grid grid-cols-7 gap-2 text-center text-[11px] font-semibold text-slate-400 mb-2">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
              </div>
              <div class="grid grid-cols-7 gap-2">
                ${calCells}
              </div>
              <div class="flex flex-wrap items-center gap-4 mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-rose-500"></span> Logged Period</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-rose-200 border border-dashed border-rose-500"></span> Predicted Period</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-teal-100 border border-teal-400"></span> Fertile Window</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-teal-500"></span> Ovulation</span>
              </div>
            </div>

            <!-- Log Period Form -->
            <form id="period-form" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
              <div>
                <h3 class="font-bold text-base">${editingLog ? 'Edit Period Details' : 'Log Period & Daily Details'}</h3>
                <p class="text-xs text-slate-500 mt-1">Record flow, symptoms, and notes separately for each day.</p>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Start Date</label>
                  <input id="p-start" type="date" value="${formStartDate}" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">End Date</label>
                  <input id="p-end" type="date" value="${formEndDate}" min="${formStartDate}" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                </div>
              </div>
              <div id="period-day-details" class="space-y-3">
                ${renderPeriodDayFields(formStartDate, formEndDate, initialDailyDetails, symptomsList)}
              </div>
              <div class="flex gap-2">
                ${editingLog ? '<button id="cancel-period-edit" type="button" class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold">Cancel</button>' : ''}
                <button type="submit" class="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold text-sm transition">${editingLog ? 'Update Period Log' : 'Save Period Log'}</button>
              </div>
            </form>
          </div>

          <!-- Cycle History -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <h3 class="font-bold text-base mb-3">Cycle History</h3>
            <div class="space-y-2">
              ${[...state.period.logs].sort((a, b) => b.startDate.localeCompare(a.startDate)).map(log => {
                const dayRows = getPeriodDailyDetails(log).map(detail => {
                  const dayLabel = new Date(`${detail.date}T00:00:00`).toLocaleDateString(undefined, {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric'
                  });
                  const symptoms = detail.symptoms.length ? detail.symptoms.map(escapeHTML).join(', ') : 'No symptoms';
                  return `
                    <div class="rounded-lg bg-white dark:bg-slate-900 px-3 py-2">
                      <div class="text-xs font-semibold">${escapeHTML(dayLabel)} · ${escapeHTML(detail.flow)} flow</div>
                      <div class="text-xs text-slate-500 mt-0.5">${symptoms}${detail.notes ? ` · ${escapeHTML(detail.notes)}` : ''}</div>
                    </div>
                  `;
                }).join('');
                return `
                  <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 space-y-3">
                    <div class="flex items-center justify-between gap-2">
                      <div class="text-sm font-semibold tabular-nums">${escapeHTML(log.startDate)} → ${escapeHTML(log.endDate || log.startDate)}</div>
                      <div class="flex gap-1 shrink-0">
                        <button data-edit-period="${escapeHTML(log.id)}" class="px-2 py-1.5 text-xs font-semibold text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-950 rounded-lg" aria-label="Edit daily period details">Edit details</button>
                        <button data-del-period="${escapeHTML(log.id)}" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg" aria-label="Delete period log"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                      </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${dayRows}</div>
                  </div>
                `;
              }).join('') || '<p class="text-sm text-slate-500">No period logs yet.</p>'}
            </div>
          </div>
        </div>
      `;

      document.getElementById('save-cycle-settings').addEventListener('click', () => {
        const cl = Number(document.getElementById('cycle-len-input').value);
        const pl = Number(document.getElementById('period-len-input').value);
        if (cl >= 18 && cl <= 45 && pl >= 2 && pl <= 12) {
          state.period.cycleLength = cl;
          state.period.periodLength = pl;
          saveState();
          renderActiveView();
          showToast('Cycle settings updated', 'success');
        }
      });

      document.getElementById('period-prev-mo').addEventListener('click', () => { state.period.viewMonthOffset--; renderActiveView(); });
      document.getElementById('period-next-mo').addEventListener('click', () => { state.period.viewMonthOffset++; renderActiveView(); });
      document.getElementById('period-today-mo').addEventListener('click', () => { state.period.viewMonthOffset = 0; renderActiveView(); });

      const periodForm = document.getElementById('period-form');
      const startInput = document.getElementById('p-start');
      const endInput = document.getElementById('p-end');
      const dayDetailsContainer = document.getElementById('period-day-details');
      const refreshPeriodDayFields = () => {
        const existingDetails = collectPeriodDayDetails(dayDetailsContainer);
        endInput.min = startInput.value;
        dayDetailsContainer.innerHTML = renderPeriodDayFields(startInput.value, endInput.value, existingDetails, symptomsList);
      };
      startInput.addEventListener('change', refreshPeriodDayFields);
      endInput.addEventListener('change', refreshPeriodDayFields);

      const cancelEditButton = document.getElementById('cancel-period-edit');
      if (cancelEditButton) {
        cancelEditButton.addEventListener('click', () => {
          uiState.editingPeriodId = null;
          renderActiveView();
        });
      }

      periodForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const startDate = startInput.value;
        const endDate = endInput.value;
        if (!startDate || !endDate || endDate < startDate) {
          showToast('Choose a valid period date range', 'warning');
          return;
        }
        const dailyDetails = collectPeriodDayDetails(dayDetailsContainer);
        if (dailyDetails.length !== diffDaysISO(startDate, endDate) + 1) {
          showToast('Add daily details for the selected date range', 'warning');
          return;
        }

        const log = editingLog || { id: uid() };
        log.startDate = startDate;
        log.endDate = endDate;
        log.dailyDetails = dailyDetails;
        log.flow = dailyDetails[0].flow;
        log.symptoms = [...new Set(dailyDetails.flatMap(detail => detail.symptoms))];
        log.notes = dailyDetails.filter(detail => detail.notes).map(detail => `${detail.date}: ${detail.notes}`).join('\n');
        if (!editingLog) state.period.logs.push(log);
        uiState.editingPeriodId = null;
        saveState();
        renderActiveView();
        showToast(editingLog ? 'Period details updated' : 'Period log saved', 'success');
      });

      container.querySelectorAll('[data-edit-period]').forEach(btn => {
        btn.addEventListener('click', () => {
          const log = state.period.logs.find(item => item.id === btn.getAttribute('data-edit-period'));
          if (!log) return;
          uiState.editingPeriodId = log.id;
          renderActiveView();
          document.getElementById('period-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      container.querySelectorAll('[data-del-period]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-period');
          state.period.logs = state.period.logs.filter(l => l.id !== id);
          saveState();
          renderActiveView();
          showToast('Period log deleted', 'info');
        });
      });
    }

          state.activity.weeklyGoalMinutes = g;

          renderActiveView();
          showToast('Weekly activity goal updated', 'success');
        }
      });

      document.getElementById('activity-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const type = document.getElementById('act-type').value;
        const intensity = document.getElementById('act-intensity').value;
        const duration = Number(document.getElementById('act-duration').value);
        const calories = Number(document.getElementById('act-calories').value);
        const date = document.getElementById('act-date').value;
        const notes = document.getElementById('act-notes').value.trim();
        if (!duration || duration <= 0) return;
        state.activity.logs.push({ id: uid(), type, intensity, duration, calories, date, notes });
        saveState();
        renderActiveView();
        showToast('Activity logged', 'success');
      });

      container.querySelectorAll('[data-edit-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const activity = state.activity.logs.find(item => item.id === btn.getAttribute('data-edit-act'));
          if (!activity) return;
          const activityTypes = getCategoryOptions('activityTypes');
          if (!activityTypes.includes(activity.type)) activityTypes.push(activity.type);
          const intensityOptions = ['Low', 'Moderate', 'High'];
          if (!intensityOptions.includes(activity.intensity)) intensityOptions.push(activity.intensity);
          openRecordEditor('Edit Activity', [
            { name: 'type', label: 'Activity', type: 'select', value: activity.type, options: activityTypes.map(value => ({ value, label: value })) },
            { name: 'intensity', label: 'Intensity', type: 'select', value: activity.intensity, options: intensityOptions.map(value => ({ value, label: value })) },
            { name: 'duration', label: 'Duration (minutes)', type: 'number', value: activity.duration, min: 1, required: true },
            { name: 'calories', label: 'Calories (kcal)', type: 'number', value: activity.calories, min: 0, required: true },
            { name: 'date', label: 'Date', type: 'date', value: activity.date, required: true },
            { name: 'notes', label: 'Notes', value: activity.notes || '', wide: true }
          ], values => {
            activity.type = values.type;
            activity.intensity = values.intensity;
            activity.duration = Number(values.duration);
            activity.calories = Number(values.calories);
            activity.date = values.date;
            activity.notes = values.notes.trim();
            saveState();
            renderActiveView();
            showToast('Activity updated', 'success');
          });
        });
      });

      container.querySelectorAll('[data-del-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-act');
          state.activity.logs = state.activity.logs.filter(l => l.id !== id);
          saveState();
          renderActiveView();
        });
      });

      const canvas = document.getElementById('activity-chart');
      if (canvas && window.Chart) {
        runtime.charts.activity = new Chart(canvas, {
          type: 'bar',
          data: {
            labels: last7Days.map(d => d.slice(5)),
            datasets: [{
              label: 'Minutes',
              data: dailyTotals,
              backgroundColor: '#f97316',
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { color: state.theme === 'dark' ? '#94a3b8' : '#64748b' } },
              x: { ticks: { color: state.theme === 'dark' ? '#94a3b8' : '#64748b' } }
            }
          }
        });
      }
    }

    function renderEntertainment(container) {

      const availableStatusOptions = getCategoryOptions('entertainmentStatuses');
      const typeOptions = [...availableTypeOptions];
      const statusOptions = [...availableStatusOptions];
      if (editing && !typeOptions.includes(editing.type)) typeOptions.unshift(editing.type);
      if (editing && !statusOptions.includes(editing.status)) statusOptions.unshift(editing.status);
      const filtered = [...state.entertainment]
        .filter(item => uiState.entertainmentFilterType === 'all' || item.type === uiState.entertainmentFilterType)
        .filter(item => uiState.entertainmentFilterStatus === 'all' || item.status === uiState.entertainmentFilterStatus)
        .filter(item => !uiState.entertainmentSearch || item.title.toLowerCase().includes(uiState.entertainmentSearch.toLowerCase()));
      const statusClasses = {
        'Want to watch/read': 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200',

        'Completed': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300',
        'Paused': 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
      };

      container.innerHTML = `
        <div class="space-y-5">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">

            <p class="text-sm text-slate-500 mt-1">Keep movies, anime, manhwa, and comics together. Your list is saved on this device and included in backups.</p>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <form id="entertainment-form" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4 h-fit">
              <div class="flex items-center justify-between gap-2">
                <h3 class="font-bold">${editing ? 'Edit title' : 'Add a title'}</h3>
                ${editing ? '<button type="button" id="cancel-entertainment-edit" class="text-xs font-semibold text-slate-500 hover:underline">Cancel</button>' : ''}
              </div>
              <label class="block text-xs font-semibold text-slate-500">
                <span class="block mb-1">Name</span>
                <input id="entertainment-title" type="text" maxlength="120" required value="${editing ? escapeHTML(editing.title) : ''}" placeholder="Enter movie, anime, manhwa, or comic name" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-normal" />
              </label>
              <label class="block text-xs font-semibold text-slate-500">
                <span class="block mb-1">Type</span>
                <select id="entertainment-type" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-normal">
                  ${typeOptions.map(type => `<option value="${escapeHTML(type)}" ${editing && editing.type === type ? 'selected' : ''}>${escapeHTML(type)}</option>`).join('')}
                </select>
              </label>
              <label class="block text-xs font-semibold text-slate-500">
                <span class="block mb-1">Status</span>
                <select id="entertainment-status" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-normal">
                  ${statusOptions.map(status => `<option value="${escapeHTML(status)}" ${editing && editing.status === status ? 'selected' : ''}>${escapeHTML(status)}</option>`).join('')}
                </select>
              </label>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-semibold text-sm transition">${editing ? 'Save changes' : 'Add to list'}</button>
            </form>

            <section class="lg:col-span-2 space-y-4">
              <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
                <h3 class="font-bold mb-3">My list <span class="text-sm font-normal text-slate-500">(${filtered.length})</span></h3>
                <form id="entertainment-search-form" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input id="entertainment-search" type="search" value="${escapeHTML(uiState.entertainmentSearch)}" placeholder="Search titles" aria-label="Search entertainment titles" class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                  <select id="entertainment-filter-type" aria-label="Filter by type" class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                    <option value="all">All types</option>
                    ${availableTypeOptions.map(type => `<option value="${escapeHTML(type)}" ${uiState.entertainmentFilterType === type ? 'selected' : ''}>${escapeHTML(type)}</option>`).join('')}
                  </select>
                  <select id="entertainment-filter-status" aria-label="Filter by status" class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                    <option value="all">All statuses</option>
                    ${availableStatusOptions.map(status => `<option value="${escapeHTML(status)}" ${uiState.entertainmentFilterStatus === status ? 'selected' : ''}>${escapeHTML(status)}</option>`).join('')}

                  <button type="submit" class="sm:col-span-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold hover:bg-slate-200 dark:hover:bg-slate-700">Search</button>
                </form>
              </div>
              <div class="space-y-3">
                ${filtered.map(item => {
                  const statusClass = Object.prototype.hasOwnProperty.call(statusClasses, item.status)

                  return `
                    <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
                      <div class="flex items-start justify-between gap-3">
                        <div class="min-w-0">

                        </div>
                        <div class="flex shrink-0 gap-1">
                          <button type="button" data-edit-entertainment="${escapeHTML(item.id)}" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-950">Edit</button>
                          <button type="button" data-delete-entertainment="${escapeHTML(item.id)}" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950">Delete</button>

                      </div>
                    </article>
                  `;
                }).join('') || `
                  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center text-slate-500">
                    ${state.entertainment.length ? 'No titles match these filters.' : 'Your list is empty. Add a title to get started.'}
                  </div>
                `}
              </div>
            </section>
          </div>
        </div>
      `;

      const cancelButton = document.getElementById('cancel-entertainment-edit');
      if (cancelButton) {
        cancelButton.addEventListener('click', () => {
          uiState.editingEntertainmentId = null;
          renderActiveView();
        });
      }

      document.getElementById('entertainment-form').addEventListener('submit', event => {
        event.preventDefault();
        const title = document.getElementById('entertainment-title').value.trim();
        const type = document.getElementById('entertainment-type').value;
        const status = document.getElementById('entertainment-status').value;
        if (!title || title.length > 120 || !typeOptions.includes(type) || !statusOptions.includes(status)) {
          showToast('Enter a title and choose a valid type and status', 'warning');
          return;
        }

        if (editing) {
          editing.title = title;
          editing.type = type;
          editing.status = status;
          uiState.editingEntertainmentId = null;
          showToast('Title updated', 'success');
        } else {
          state.entertainment.unshift({ id: uid(), title, type, status });
          showToast('Added to your entertainment list', 'success');
        }
        saveState();
        renderActiveView();
      });

      document.getElementById('entertainment-search-form').addEventListener('submit', event => {
        event.preventDefault();
        uiState.entertainmentSearch = document.getElementById('entertainment-search').value.trim();
        uiState.entertainmentFilterType = document.getElementById('entertainment-filter-type').value;
        uiState.entertainmentFilterStatus = document.getElementById('entertainment-filter-status').value;
        renderActiveView();
      });

      container.querySelectorAll('[data-edit-entertainment]').forEach(button => {
        button.addEventListener('click', () => {
          uiState.editingEntertainmentId = button.getAttribute('data-edit-entertainment');
          renderActiveView();
        });
      });

      container.querySelectorAll('[data-delete-entertainment]').forEach(button => {
        button.addEventListener('click', () => {
          const item = state.entertainment.find(entry => entry.id === button.getAttribute('data-delete-entertainment'));
          if (!item) return;
          openModal({
            title: 'Delete this title?',
            body: `Remove "${item.title}" from your entertainment list?`,
            icon: 'trash-2',
            actions: [
              { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800' },
              {
                label: 'Delete',
                className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white hover:bg-rose-700 transition',
                onClick: () => {
                  state.entertainment = state.entertainment.filter(entry => entry.id !== item.id);
                  if (uiState.editingEntertainmentId === item.id) uiState.editingEntertainmentId = null;
                  saveState();
                  renderActiveView();
                  showToast('Title deleted', 'success');
                }
              }
            ]
          });

      });

    // -------------------------------------------------------------------------

    function renderProgress(container) {
      const today = todayISO();
      const last7 = Array.from({ length: 7 }, (_, i) => addDaysISO(today, i - 6));

      container.innerHTML = `
        <div class="space-y-6">
          <!-- Milestone Goals -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

              <div>

                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Target</label>

                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Unit</label>
                  <input id="g-unit" type="text" value="modules" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Category</label>
                  <select id="g-cat" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                    ${getCategoryOptions('goalCategories').map(category => `<option value="${escapeHTML(category)}" ${category === 'Personal' ? 'selected' : ''}>${escapeHTML(category)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Deadline</label>

                </div>
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-semibold text-sm transition">Add Goal</button>
            </form>

            <div class="lg:col-span-2 space-y-3">
              ${state.progress.goals.map(g => {
                const pct = g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0;
                const step = g.target >= 1000 ? 500 : 1;
                return `
                  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
                    <div class="flex items-start justify-between gap-3">
                      <div>
                        <div class="flex items-center gap-2">
                          <h4 class="font-bold text-base">${escapeHTML(g.title)}</h4>
                          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-violet-100 text-violet-700 dark:bg-violet-950 dark:text-violet-300">${escapeHTML(g.category)}</span>
                        </div>

          </div>

          <!-- Daily Habit Streaks -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <h3 class="font-bold text-base">Daily Habit Streaks (Last 7 Days)</h3>
              <form id="habit-form" class="flex items-center gap-2">
                <input id="habit-title-input" type="text" required placeholder="New daily habit..." class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                <button type="submit" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold">Add</button>
              </form>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="text-xs text-slate-500 border-b border-slate-200 dark:border-slate-800">

                    ${last7.map(d => `<th class="text-center py-2 px-2 tabular-nums">${d.slice(5)}</th>`).join('')}
                    <th class="text-right py-2 pl-4">Streak</th>
                    <th class="text-right py-2 pl-2"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${state.progress.habits.map(h => `

                      <td class="py-3 pr-4 font-medium">${escapeHTML(h.title)}</td>
                      ${last7.map(d => {
                        const checked = (h.history || []).includes(d);
                        return `
                          <td class="py-3 px-2 text-center">
                            <button data-toggle-habit="${escapeHTML(h.id)}" data-date="${d}" class="w-7 h-7 rounded-lg inline-flex items-center justify-center transition ${

                      <td class="py-3 pl-4 text-right font-bold text-amber-600 dark:text-amber-400 tabular-nums">${getHabitStreak(h)}d</td>

                        <button data-edit-habit="${escapeHTML(h.id)}" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg" aria-label="Edit habit"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button data-del-habit="${escapeHTML(h.id)}" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('goal-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('g-title').value.trim();
        const current = Number(document.getElementById('g-current').value);
        const target = Number(document.getElementById('g-target').value);
        const unit = document.getElementById('g-unit').value.trim();
        const category = document.getElementById('g-cat').value;
        const deadline = document.getElementById('g-deadline').value;
        if (!title || target <= 0) return;
        state.progress.goals.push({ id: uid(), title, current, target, unit, category, deadline });
        saveState();
        renderActiveView();
        showToast('Goal added', 'success');
      });

      container.querySelectorAll('[data-edit-goal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const goal = state.progress.goals.find(item => item.id === btn.getAttribute('data-edit-goal'));
          if (!goal) return;
          const categories = getCategoryOptions('goalCategories');
          if (!categories.includes(goal.category)) categories.push(goal.category);
          openRecordEditor('Edit Goal', [
            { name: 'title', label: 'Goal Title', value: goal.title, wide: true, required: true },
            { name: 'current', label: 'Current Progress', type: 'number', value: goal.current, min: 0, required: true },
            { name: 'target', label: 'Target', type: 'number', value: goal.target, min: 1, required: true },
            { name: 'unit', label: 'Unit', value: goal.unit, required: true },
            { name: 'category', label: 'Category', type: 'select', value: goal.category, options: categories.map(value => ({ value, label: value })) },
            { name: 'deadline', label: 'Deadline', type: 'date', value: goal.deadline || '' }
          ], values => {
            goal.title = values.title.trim();
            goal.current = Number(values.current);
            goal.target = Number(values.target);
            goal.unit = values.unit.trim();
            goal.category = values.category;
            goal.deadline = values.deadline;
            saveState();
            renderActiveView();
            showToast('Goal updated', 'success');
          });
        });
      });

      container.querySelectorAll('[data-goal-step]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-goal-step');
          const delta = Number(btn.getAttribute('data-delta'));
          const g = state.progress.goals.find(x => x.id === id);
          if (g) {
            g.current = Math.max(0, g.current + delta);
            saveState();
            renderActiveView();
          }
        });
      });

      container.querySelectorAll('[data-del-goal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-goal');
          state.progress.goals = state.progress.goals.filter(g => g.id !== id);
          saveState();
          renderActiveView();
        });
      });

      document.getElementById('habit-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('habit-title-input').value.trim();
        if (!title) return;
        state.progress.habits.push({ id: uid(), title, history: [] });
        saveState();
        renderActiveView();
        showToast('Habit added', 'success');
      });

      container.querySelectorAll('[data-edit-habit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const habit = state.progress.habits.find(item => item.id === btn.getAttribute('data-edit-habit'));
          if (!habit) return;
          openRecordEditor('Edit Habit', [
            { name: 'title', label: 'Habit Name', value: habit.title, wide: true, required: true }
          ], values => {
            habit.title = values.title.trim();
            saveState();
            renderActiveView();
            showToast('Habit updated', 'success');
          });
        });
      });

      container.querySelectorAll('[data-toggle-habit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle-habit');
          const dt = btn.getAttribute('data-date');
          const h = state.progress.habits.find(x => x.id === id);
          if (h) {
            h.history = h.history || [];
            if (h.history.includes(dt)) h.history = h.history.filter(x => x !== dt);
            else h.history.push(dt);
            saveState();
            renderActiveView();
          }
        });
      });

      container.querySelectorAll('[data-del-habit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-habit');
          state.progress.habits = state.progress.habits.filter(h => h.id !== id);
          saveState();
          renderActiveView();
        });
      });
    }

    // -------------------------------------------------------------------------
    // 5. TO-DO LIST
    // -------------------------------------------------------------------------
    function renderTodos(container) {
      const total = state.todos.length;
      const doneCount = state.todos.filter(t => t.done).length;
      const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      const todoCategories = getCategoryOptions('taskCategories');

      const filtered = state.todos
        .filter(t => uiState.todoFilterStatus === 'all' || (uiState.todoFilterStatus === 'active' ? !t.done : t.done))
        .filter(t => uiState.todoFilterPriority === 'all' || t.priority === uiState.todoFilterPriority)
        .filter(t => !uiState.todoSearch || t.title.toLowerCase().includes(uiState.todoSearch.toLowerCase()));

      container.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between text-sm font-semibold mb-2">
              <span>Completion Progress (${doneCount} of ${total} tasks)</span>
              <span class="text-sky-600 dark:text-sky-400 tabular-nums">${pct}%</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
              <div class="h-full bg-sky-500 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>
          </div>

          <form id="todo-form" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 items-end">
            <div class="lg:col-span-2">
              <label class="block text-xs font-semibold text-slate-500 mb-1">Task Title</label>
              <input id="todo-title" type="text" required placeholder="What needs to be done?" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Priority</label>
              <select id="todo-priority" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                <option>High</option><option selected>Medium</option><option>Low</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Category</label>
              <select id="todo-category" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                ${todoCategories.map(category => `<option value="${escapeHTML(category)}" ${category === 'Personal' ? 'selected' : ''}>${escapeHTML(category)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Due Date</label>
              <input id="todo-due" type="date" value="${todayISO()}" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
            </div>
            <button type="submit" class="py-2 px-4 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm transition">Add Task</button>
          </form>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-1.5">
                ${['all', 'active', 'completed'].map(st => `
                  <button data-todo-status="${st}" class="px-3 py-1.5 rounded-xl text-xs font-semibold capitalize transition ${
                    uiState.todoFilterStatus === st ? 'bg-sky-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
                  }">${st}</button>
                `).join('')}
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <input id="todo-search" type="text" value="${escapeHTML(uiState.todoSearch)}" placeholder="Search tasks..." class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                <select id="todo-filter-prio" class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  <option value="all">All Priorities</option>
                  <option value="High" ${uiState.todoFilterPriority === 'High' ? 'selected' : ''}>High</option>
                  <option value="Medium" ${uiState.todoFilterPriority === 'Medium' ? 'selected' : ''}>Medium</option>
                  <option value="Low" ${uiState.todoFilterPriority === 'Low' ? 'selected' : ''}>Low</option>
                </select>
                <button id="clear-completed-todos" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40">Clear Completed</button>
              </div>
            </div>

            <div class="space-y-2">
              ${filtered.map(t => `
                <div class="flex items-center justify-between gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                  <label class="flex items-center gap-3 min-w-0 cursor-pointer flex-1">
                    <input type="checkbox" data-toggle-todo="${escapeHTML(t.id)}" ${t.done ? 'checked' : ''} class="w-4 h-4 rounded text-sky-600" />
                    <div class="min-w-0">
                      <div class="text-sm font-medium truncate ${t.done ? 'line-through text-slate-400' : ''}">${escapeHTML(t.title)}</div>
                      <div class="text-xs text-slate-500 tabular-nums">${t.dueDate ? `Due: ${t.dueDate}` : 'No due date'}</div>
                    </div>
                  </label>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${
                      t.priority === 'High' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                      t.priority === 'Medium' ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300' :
                      'bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300'
                    }">${t.priority}</span>
                    <button data-edit-todo="${escapeHTML(t.id)}" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg" aria-label="Edit task"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    <button data-del-todo="${escapeHTML(t.id)}" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                </div>
              `).join('') || '<p class="text-sm text-slate-500 text-center py-6">No tasks match your filter.</p>'}
            </div>
          </div>
        </div>
      `;

      document.getElementById('todo-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('todo-title').value.trim();
        const priority = document.getElementById('todo-priority').value;
        const category = document.getElementById('todo-category').value;
        const dueDate = document.getElementById('todo-due').value;
        if (!title) return;
        state.todos.unshift({ id: uid(), title, priority, category, dueDate, done: false });
        saveState();
        renderActiveView();
        showToast('Task added', 'success');
      });

      container.querySelectorAll('[data-todo-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.todoFilterStatus = btn.getAttribute('data-todo-status');
          renderActiveView();
        });
      });

      document.getElementById('todo-search').addEventListener('input', (e) => {
        uiState.todoSearch = e.target.value;
        renderActiveView();
      });
      document.getElementById('todo-filter-prio').addEventListener('change', (e) => {
        uiState.todoFilterPriority = e.target.value;
        renderActiveView();
      });
      container.querySelectorAll('[data-edit-todo]').forEach(btn => {
        btn.addEventListener('click', () => {
          const task = state.todos.find(item => item.id === btn.getAttribute('data-edit-todo'));
          if (!task) return;
          if (task.category && !todoCategories.includes(task.category)) todoCategories.push(task.category);
          openRecordEditor('Edit Task', [
            { name: 'title', label: 'Task Title', value: task.title, wide: true, required: true },
            { name: 'priority', label: 'Priority', type: 'select', value: task.priority, options: ['High', 'Medium', 'Low'].map(value => ({ value, label: value })) },
            { name: 'category', label: 'Category', type: 'select', value: task.category || 'Personal', options: todoCategories.map(value => ({ value, label: value })) },
            { name: 'dueDate', label: 'Due Date', type: 'date', value: task.dueDate || '' },
            { name: 'done', label: 'Completed', type: 'checkbox', value: task.done, checkboxLabel: 'Mark this task as completed', wide: true }
          ], values => {
            task.title = values.title.trim();
            task.priority = values.priority;
            task.category = values.category;
            task.dueDate = values.dueDate;
            task.done = values.done === 'on';
            saveState();
            renderActiveView();
            showToast('Task updated', 'success');
          });
        });
      });
      document.getElementById('clear-completed-todos').addEventListener('click', () => {
        state.todos = state.todos.filter(t => !t.done);
        saveState();
        renderActiveView();
        showToast('Cleared completed tasks', 'info');
      });

      container.querySelectorAll('[data-toggle-todo]').forEach(cb => {
        cb.addEventListener('change', () => {
          const id = cb.getAttribute('data-toggle-todo');
          const t = state.todos.find(x => x.id === id);
          if (t) {
            t.done = cb.checked;
            saveState();
            renderActiveView();
          }
        });
      });

      container.querySelectorAll('[data-del-todo]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-todo');
          state.todos = state.todos.filter(t => t.id !== id);
          saveState();
          renderActiveView();
        });
      });
    }

    // -------------------------------------------------------------------------
    // 6. NOTES
    // -------------------------------------------------------------------------
    function renderNotes(container) {
      const editing = uiState.editingNoteId ? state.notes.find(n => n.id === uiState.editingNoteId) : null;
      const noteTags = [...new Set([
        ...getCategoryOptions('noteTags'),
        ...state.notes.map(note => note.tag).filter(tag => typeof tag === 'string' && tag.trim())
      ])];
      const filtered = [...state.notes]
        .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt.localeCompare(a.updatedAt))
        .filter(n => uiState.noteFilterTag === 'all' || n.tag === uiState.noteFilterTag)
        .filter(n => !uiState.noteSearch || n.title.toLowerCase().includes(uiState.noteSearch.toLowerCase()) || n.content.toLowerCase().includes(uiState.noteSearch.toLowerCase()));

      const colorMap = {
        amber: 'border-l-4 border-l-amber-400',
        indigo: 'border-l-4 border-l-indigo-500',
        emerald: 'border-l-4 border-l-emerald-500',
        rose: 'border-l-4 border-l-rose-500'
      };

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <form id="note-form" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4 h-fit">
            <div class="flex items-center justify-between">
              <h3 class="font-bold text-base">${editing ? 'Edit Note' : 'New Note'}</h3>
              ${editing ? '<button type="button" id="cancel-edit-note" class="text-xs text-slate-500 hover:underline">Cancel</button>' : ''}
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Title</label>
              <input id="note-title" type="text" required value="${editing ? escapeHTML(editing.title) : ''}" placeholder="Note title..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Tag</label>
                <select id="note-tag" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  ${noteTags.map(tag => `<option value="${escapeHTML(tag)}" ${editing && editing.tag === tag ? 'selected' : ''}>${escapeHTML(tag)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Accent</label>
                <select id="note-color" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  ${['amber', 'indigo', 'emerald', 'rose'].map(c => `<option value="${c}" ${editing && editing.color === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Content</label>
              <textarea id="note-content" rows="6" required placeholder="Write your note here..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">${editing ? escapeHTML(editing.content) : ''}</textarea>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold text-sm transition">${editing ? 'Update Note' : 'Save Note'}</button>
          </form>

          <div class="lg:col-span-2 space-y-4">
            <div class="flex flex-wrap items-center gap-2">
              <input id="note-search" type="text" value="${escapeHTML(uiState.noteSearch)}" placeholder="Search notes..." class="flex-1 min-w-[180px] px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm" />
              <select id="note-filter-tag" class="px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm">
                <option value="all">All Tags</option>
              ${noteTags.map(tag => `<option value="${escapeHTML(tag)}" ${uiState.noteFilterTag === tag ? 'selected' : ''}>${escapeHTML(tag)}</option>`).join('')}
              </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${filtered.map(n => `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between gap-3 ${colorMap[n.color] || ''}">
                  <div>
                    <div class="flex items-start justify-between gap-2">
                      <h4 class="font-bold text-base">${escapeHTML(n.title)}</h4>
                      <div class="flex items-center gap-1 shrink-0">
                        <button data-pin-note="${escapeHTML(n.id)}" class="p-1 rounded-lg ${n.pinned ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'}" title="Pin note"><i data-lucide="pin" class="w-4 h-4"></i></button>
                        <button data-edit-note="${escapeHTML(n.id)}" class="p-1 text-slate-400 hover:text-indigo-600 rounded-lg" title="Edit"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button data-del-note="${escapeHTML(n.id)}" class="p-1 text-slate-400 hover:text-rose-600 rounded-lg" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                      </div>
                    </div>
                    <p class="text-sm text-slate-600 dark:text-slate-300 mt-2 whitespace-pre-line">${escapeHTML(n.content)}</p>
                  </div>
                  <div class="flex items-center justify-between text-[11px] text-slate-400 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium">${escapeHTML(n.tag)}</span>
                    <span>${new Date(n.updatedAt).toLocaleDateString()}</span>
                  </div>
                </div>
              `).join('') || '<div class="col-span-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center text-slate-500">No notes found.</div>'}
            </div>
          </div>
        </div>
      `;

      const cancelBtn = document.getElementById('cancel-edit-note');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          uiState.editingNoteId = null;
          renderActiveView();
        });
      }

      document.getElementById('note-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('note-title').value.trim();
        const tag = document.getElementById('note-tag').value;
        const color = document.getElementById('note-color').value;
        const content = document.getElementById('note-content').value.trim();
        if (!title || !content) return;
        if (uiState.editingNoteId) {
          const existing = state.notes.find(n => n.id === uiState.editingNoteId);
          if (existing) {
            existing.title = title;
            existing.tag = tag;
            existing.color = color;
            existing.content = content;
            existing.updatedAt = new Date().toISOString();
          }
          uiState.editingNoteId = null;
          showToast('Note updated', 'success');
        } else {
          state.notes.unshift({ id: uid(), title, tag, color, pinned: false, content, updatedAt: new Date().toISOString() });
          showToast('Note saved', 'success');
        }
        saveState();
        renderActiveView();
      });

      document.getElementById('note-search').addEventListener('input', (e) => {
        uiState.noteSearch = e.target.value;
        renderActiveView();
      });
      document.getElementById('note-filter-tag').addEventListener('change', (e) => {
        uiState.noteFilterTag = e.target.value;
        renderActiveView();
      });

      container.querySelectorAll('[data-pin-note]').forEach(btn => {
        btn.addEventListener('click', () => {
          const n = state.notes.find(x => x.id === btn.getAttribute('data-pin-note'));
          if (n) { n.pinned = !n.pinned; saveState(); renderActiveView(); }
        });
      });
      container.querySelectorAll('[data-edit-note]').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.editingNoteId = btn.getAttribute('data-edit-note');
          renderActiveView();
        });
      });
      container.querySelectorAll('[data-del-note]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-note');
          state.notes = state.notes.filter(n => n.id !== id);
          if (uiState.editingNoteId === id) uiState.editingNoteId = null;
          saveState();
          renderActiveView();
        });
      });
    }

    // -------------------------------------------------------------------------
    // 7. TIME TOOLS (TIMER, STOPWATCH, ALARM)
    // -------------------------------------------------------------------------
    function renderTimeTools(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-2 w-fit shadow-sm">
            ${[
              { id: 'timer', label: 'Timer', icon: 'hourglass' },
              { id: 'stopwatch', label: 'Stopwatch', icon: 'watch' },
              { id: 'alarm', label: 'Alarm', icon: 'alarm-clock' }
            ].map(tab => `
              <button data-time-tab="${escapeHTML(tab.id)}" class="px-4 py-2 rounded-xl text-sm font-semibold inline-flex items-center gap-2 transition ${
                uiState.timeSubTab === tab.id ? 'bg-cyan-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
              }">
                <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                ${tab.label}
              </button>
            `).join('')}
          </div>
          <div id="time-subview"></div>
        </div>
      `;

      container.querySelectorAll('[data-time-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.timeSubTab = btn.getAttribute('data-time-tab');
          renderActiveView();
        });
      });

      renderTimeToolsSection();
    }

    function renderTimeToolsSection() {
      const sub = document.getElementById('time-subview');
      if (!sub) return;

      if (uiState.timeSubTab === 'timer') {
        const circumference = 2 * Math.PI * 88;
        const pct = runtime.timer.totalSeconds > 0 ? runtime.timer.remainingSeconds / runtime.timer.totalSeconds : 0;
        sub.innerHTML = `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm max-w-xl mx-auto text-center space-y-6">
            <div class="relative w-52 h-52 mx-auto flex items-center justify-center">
              <svg class="w-full h-full -rotate-90" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="10" class="text-slate-100 dark:text-slate-800" />
                <circle id="timer-ring-progress" cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"
                  class="text-cyan-500 transition-all duration-300"
                  style="stroke-dasharray: ${circumference}; stroke-dashoffset: ${circumference * (1 - pct)};" />
              </svg>
              <div id="timer-readout" class="absolute text-4xl font-bold tabular-nums">${formatTimerSeconds(runtime.timer.remainingSeconds)}</div>
            </div>

    function encodeSyncCode(obj) {
      const json = JSON.stringify(obj);
      const bytes = new TextEncoder().encode(json);
      let bin = '';
      bytes.forEach(b => { bin += String.fromCharCode(b); });
      return 'LF1:' + btoa(bin);
    }

    function decodeSyncCode(str) {
      const trimmed = str.trim();
      if (trimmed.startsWith('{')) {
        return JSON.parse(trimmed);
      }
      const b64 = trimmed.startsWith('LF1:') ? trimmed.slice(4) : trimmed;
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const json = new TextDecoder().decode(bytes);
      return JSON.parse(json);
    }

    function applyImportedState(parsed) {
      state = normalizeStateData(parsed, true);
      saveState();
      applyTheme();
      renderNav();
      renderActiveView();
    }

    function confirmRestore(parsed, successMessage) {
      openModal({
        title: 'Replace data on this device?',
        body: 'Restoring this backup will replace the data currently saved on this device. Export a backup first if you may need the current data.',
        icon: 'download-cloud',
        actions: [
          { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800' },
          {
            label: 'Restore backup',
            onClick: () => {
              try {
                applyImportedState(parsed);
                showToast(successMessage, 'success');
              } catch (error) {
                showToast(error.message || 'Backup restore failed.', 'error');
              }
            }
          }
        ]
      });
    }

    function copyTextFallback(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        });
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      return Promise.resolve();
    }

      renderNav();
      renderActiveView();

      document.getElementById('mobile-menu-btn').addEventListener('click', openMobileSidebar);
      document.getElementById('close-sidebar-btn').addEventListener('click', closeMobileSidebar);
      document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileSidebar);
      document.getElementById('desktop-theme-btn').addEventListener('click', toggleTheme);
      document.getElementById('mobile-theme-btn').addEventListener('click', toggleTheme);
      document.getElementById('record-editor-close').addEventListener('click', closeRecordEditor);
      document.getElementById('record-editor-cancel').addEventListener('click', closeRecordEditor);
      document.getElementById('record-editor-modal').addEventListener('click', (event) => {
        if (event.target.id === 'record-editor-modal') closeRecordEditor();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeRecordEditor();
      });

      const jumpToTime = () => {
        state.activeTab = 'time';
        saveState();
        renderNav();
        renderActiveView();
      };
      document.getElementById('desktop-time-pill').addEventListener('click', jumpToTime);
      document.getElementById('mobile-time-pill').addEventListener('click', jumpToTime);

      document.getElementById('reset-demo-btn').addEventListener('click', () => {
        openModal({
          title: 'Clear All Data?',
          body: 'This permanently removes all saved transactions, logs, goals, tasks, notes, and alarms from this device. Export a backup first if you may want this data later.',
          icon: 'rotate-ccw',
          actions: [
            { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition' },
            {
              label: 'Clear Data',
              className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white hover:bg-rose-700 transition',
              onClick: () => {
                pauseTimer();
                pauseStopwatch();
                state = getDefaultState();
                saveState();
                applyTheme();
                renderNav();
                renderActiveView();
                showToast('All data cleared from this device', 'info');
              }
            }
          ]
        });
      });

      updateLiveClockAndAlarms();
      runtime.alarmCheckIntervalId = setInterval(updateLiveClockAndAlarms, 1000);
    });
  </script>
</body>
</html>

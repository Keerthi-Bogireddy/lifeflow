    tailwind.config = {

  <style>
    :root {
      color-scheme: light;
      --app-accent: #6366f1;
    }
    html.dark { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-image: radial-gradient(ellipse at top left, rgba(99, 102, 241, 0.06), transparent 34rem);
    }
    button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .animate-pulse-ring { animation: pulse-ring 1.6s ease-in-out infinite; }
    .dashboard-welcome {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      overflow: hidden;
      border-radius: 1.5rem;
      padding: 1.75rem;
      color: #fff;
      background: linear-gradient(118deg, #4f46e5 0%, #6366f1 52%, #8b5cf6 100%);
      box-shadow: 0 16px 36px rgba(79, 70, 229, 0.18);
    }
    .dashboard-welcome::after {
      position: absolute;
      top: -5rem;
      right: 6rem;
      width: 15rem;
      height: 15rem;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      box-shadow: 0 0 0 2rem rgba(255, 255, 255, 0.045), 0 0 0 4rem rgba(255, 255, 255, 0.035);
      content: '';
      pointer-events: none;
    }
    .dashboard-stat-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border-radius: 1.25rem;
      border-color: rgba(148, 163, 184, 0.2);
      background-color: #fff;
      background: linear-gradient(145deg, #fff 0%, #fff 72%, color-mix(in srgb, var(--card-accent) 7%, white) 100%);
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.035);
    }
    .dashboard-stat-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08); }
    .dashboard-stat-label { font-size: 0.66rem; letter-spacing: 0.1em; }
    .dashboard-stat-value { font-size: clamp(1.25rem, 3.8vw, 1.7rem); letter-spacing: -0.035em; }
    .dashboard-stat-icon { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
    .mobile-bottom-nav { display: none; }
    html.dark .dashboard-stat-card {
      border-color: rgba(71, 85, 105, 0.65);
      background-color: #0f172a;
      background: linear-gradient(145deg, #0f172a 0%, #0f172a 72%, color-mix(in srgb, var(--card-accent) 13%, #0f172a) 100%);
    }
    @media (max-width: 767px) {
      #main-content { padding-bottom: calc(6.25rem + env(safe-area-inset-bottom)); }
      #toast-container { bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
      .mobile-bottom-nav {
        position: fixed;
        z-index: 35;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        padding: 0.45rem 0.5rem calc(0.45rem + env(safe-area-inset-bottom));
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.07);
        backdrop-filter: blur(18px);
      }
      .mobile-bottom-nav button {
        display: flex;
        min-height: 3.25rem;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        border-radius: 0.9rem;
        color: #64748b;
        font-size: 0.65rem;
        font-weight: 600;
        transition: color 150ms ease, background 150ms ease;
      }
      .mobile-bottom-nav button.is-active { color: #4f46e5; background: #eef2ff; }
      .mobile-bottom-nav button:active { transform: scale(0.96); }
      html.dark .mobile-bottom-nav {
        border-color: rgba(51, 65, 85, 0.8);
        background: rgba(15, 23, 42, 0.94);
        box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.22);
      }
      html.dark .mobile-bottom-nav button { color: #94a3b8; }
      html.dark .mobile-bottom-nav button.is-active { color: #c7d2fe; background: rgba(49, 46, 129, 0.5); }
      .dashboard-welcome { min-height: 9.5rem; padding: 1.35rem; }
      .dashboard-welcome::after { right: -5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>

        </div>

  </div>

  <script>
    // =========================================================================
    // STORAGE & INITIAL STATE
    // =========================================================================
    const STORAGE_KEY = 'lifeflow_personal_hub_v1';

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function todayISO() {
      const d = new Date();
      return formatDateISO(d);
    }

    function formatDateISO(d) {
      const yr = d.getFullYear();
      const mo = String(d.getMonth() + 1).padStart(2, '0');
      const da = String(d.getDate()).padStart(2, '0');
      return `${yr}-${mo}-${da}`;
    }

    function addDaysISO(iso, days) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return formatDateISO(dt);
    }

    function diffDaysISO(isoA, isoB) {
      const [y1, m1, d1] = isoA.split('-').map(Number);
      const [y2, m2, d2] = isoB.split('-').map(Number);
      const a = new Date(y1, m1 - 1, d1);
      const b = new Date(y2, m2 - 1, d2);
      return Math.round((b - a) / 86400000);
    }

    function isValidISODate(value) {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
    }

    const ENTERTAINMENT_TYPES = ['Movie', 'Anime', 'Manhwa', 'Comic'];
    const ENTERTAINMENT_STATUSES = ['Want to watch/read', 'In progress', 'Completed', 'Paused'];

    const CATEGORY_GROUPS = {
      budgetCategories: {
        label: 'Budget categories',
        defaults: ['Food', 'Housing', 'Transport', 'Utilities', 'Health', 'Entertainment', 'Shopping', 'Salary', 'Freelance', 'Other']
      },
      paymentMethods: {
        label: 'Payment methods',
        defaults: ['Cash', 'UPI', 'Debit card', 'Credit card', 'Net banking', 'Other']
      },
      periodFlows: {
        label: 'Period flow levels',
        defaults: ['Light', 'Medium', 'Heavy']
      },
      periodSymptoms: {
        label: 'Period symptoms',
        defaults: ['Cramps', 'Fatigue', 'Headache', 'Bloating', 'Mood Swings', 'Backache', 'Clear']
      },
      entertainmentTypes: {
        label: 'Entertainment types',
        defaults: ENTERTAINMENT_TYPES
      },
      entertainmentStatuses: {
        label: 'Entertainment statuses',
        defaults: ENTERTAINMENT_STATUSES
      },
      activityTypes: {
        label: 'Activity types',
        defaults: ['Walking', 'Running', 'Cycling', 'Yoga', 'Gym', 'Swimming', 'Meditation', 'Other']
      },
      goalCategories: {
        label: 'Goal categories',
        defaults: ['Personal', 'Finance', 'Fitness', 'Learning', 'Career']
      },
      taskCategories: {
        label: 'Task categories',
        defaults: ['Work', 'Personal', 'Finance', 'Health', 'Learning', 'Other']
      },
      noteTags: {
        label: 'Note tags',
        defaults: ['Personal', 'Work', 'Ideas', 'Health', 'Journal']
      }
    };

    const CURRENCY_OPTIONS = [
      { symbol: '₹', label: 'Indian Rupee' },
      { symbol: '$', label: 'US Dollar' },
      { symbol: '€', label: 'Euro' },
      { symbol: '£', label: 'British Pound' },
      { symbol: '¥', label: 'Japanese Yen' },
      { symbol: 'C$', label: 'Canadian Dollar' },
      { symbol: 'A$', label: 'Australian Dollar' },
      { symbol: 'S$', label: 'Singapore Dollar' },
      { symbol: 'AED', label: 'UAE Dirham', spaced: true },
      { symbol: 'SAR', label: 'Saudi Riyal', spaced: true },
      { symbol: '₱', label: 'Philippine Peso' },
      { symbol: '₩', label: 'South Korean Won' },
      { symbol: '₦', label: 'Nigerian Naira' },
      { symbol: 'R', label: 'South African Rand' }
    ];

    function getDefaultState() {
      return {
        theme: 'light',
        activeTab: 'dashboard',
        currency: '₹',
        customOptions: {},
        budget: {
          monthlyLimit: 45000,
          transactions: [],
          transfers: [],
          profiles: [{ id: 'personal', name: 'Personal', openingBalance: 0 }],
          activeProfileId: 'personal'
        },
        period: {
          cycleLength: 28,
          periodLength: 5,
          viewMonthOffset: 0,
          logs: []
        },
        activity: {
          weeklyGoalMinutes: 180,
          logs: []
        },
        progress: {
          goals: [],
          habits: []
        },
        entertainment: [],
        todos: [],
        notes: [],
        alarms: []
      };
    }

    function getCategoryOptionsFrom(customOptions, key) {
      const group = CATEGORY_GROUPS[key];
      if (!group) return [];
      const custom = customOptions && Array.isArray(customOptions[key]) ? customOptions[key] : [];
      const validCustom = custom
        .filter(value => typeof value === 'string')
        .map(value => value.trim())
        .filter(value => value && value.length <= 40);
      return [...new Set([...group.defaults, ...validCustom])];
    }

    function normalizeStateData(parsed, strict = false) {
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        throw new Error('Backup data must be a JSON object.');
      }
      const defaults = getDefaultState();
      const parsedBudget = parsed.budget && typeof parsed.budget === 'object' && !Array.isArray(parsed.budget)
        ? parsed.budget
        : {};
      const rawEntertainment = parsed.entertainment === undefined ? defaults.entertainment : parsed.entertainment;
      if (!Array.isArray(rawEntertainment)) throw new Error('Entertainment items must be a list.');
      if (strict && (!parsed.budget || !Array.isArray(parsed.budget.transactions) ||
          !Array.isArray(parsed.todos) || !Array.isArray(parsed.notes) ||
          !Array.isArray(parsed.period?.logs) || !Array.isArray(parsed.activity?.logs) ||
          !Array.isArray(parsed.progress?.goals) || !Array.isArray(parsed.progress?.habits) ||
          !Array.isArray(parsed.alarms))) {
        throw new Error('Backup is missing required LifeFlow data lists.');
      }
      const entertainment = rawEntertainment
        .filter(item => item && typeof item === 'object' && !Array.isArray(item) &&
          typeof item.id === 'string' && item.id.trim() &&
          typeof item.title === 'string' && item.title.trim() && item.title.trim().length <= 120 &&
          typeof item.type === 'string' && item.type.trim() && item.type.trim().length <= 40 &&
          typeof item.status === 'string' && item.status.trim() && item.status.trim().length <= 40)
        .map(item => ({
          id: item.id.trim(),
          title: item.title.trim(),
          type: item.type.trim(),
          status: item.status.trim()
        }));
      if (strict && entertainment.length !== rawEntertainment.length) {
        throw new Error('Backup contains an invalid entertainment item.');
      }
      if (strict && new Set(entertainment.map(item => item.id)).size !== entertainment.length) {
        throw new Error('Entertainment item IDs must be unique.');
      }

      const rawProfiles = parsedBudget.profiles === undefined
        ? defaults.budget.profiles
        : parsedBudget.profiles;
      if (!Array.isArray(rawProfiles)) throw new Error('Financial profiles must be a list.');
      const profiles = rawProfiles.filter(profile =>
        profile && typeof profile.id === 'string' && profile.id.trim() &&
        typeof profile.name === 'string' && profile.name.trim().length <= 60 &&
        Number.isFinite(Number(profile.openingBalance || 0))
      ).map(profile => ({
        ...profile,
        id: profile.id.trim(),
        name: profile.name.trim(),
        openingBalance: Number(profile.openingBalance) || 0
      }));
      if (strict && profiles.length !== rawProfiles.length) {
        throw new Error('Backup contains an invalid financial profile.');
      }
      if (new Set(profiles.map(profile => profile.id)).size !== profiles.length) {
        throw new Error('Financial profile IDs must be unique.');
      }
      if (!profiles.length) profiles.push({ id: 'personal', name: 'Personal', openingBalance: 0 });
      const profileIds = new Set(profiles.map(profile => profile.id));
      const fallbackProfileId = profiles[0].id;

      const rawTransactions = parsedBudget.transactions === undefined
        ? defaults.budget.transactions
        : parsedBudget.transactions;
      const rawTransfers = parsedBudget.transfers === undefined
        ? defaults.budget.transfers
        : parsedBudget.transfers;
      if (!Array.isArray(rawTransactions)) throw new Error('Transactions must be a list.');
      if (!Array.isArray(rawTransfers)) throw new Error('Transfers must be a list.');
      const transactions = rawTransactions.map(transaction => {
        if (!transaction || typeof transaction !== 'object' || Array.isArray(transaction)) {
          throw new Error('Backup contains an invalid transaction.');
        }
        const profileId = transaction.profileId || fallbackProfileId;
        if (strict && !profileIds.has(profileId)) {
          throw new Error('A transaction refers to a financial profile that does not exist.');
        }
        if (strict && (!['income', 'expense'].includes(transaction.type) ||
            !Number.isFinite(Number(transaction.amount)) || Number(transaction.amount) <= 0 ||
            !isValidISODate(transaction.date) || typeof transaction.desc !== 'string' ||
            typeof transaction.category !== 'string' || typeof transaction.id !== 'string' || !transaction.id)) {
          throw new Error('Backup contains an incomplete transaction.');
        }
        return { ...transaction, profileId: profileIds.has(profileId) ? profileId : fallbackProfileId };
      });
      const transfers = rawTransfers.map(transfer => {
        if (!transfer || typeof transfer !== 'object' || Array.isArray(transfer)) {
          throw new Error('Backup contains an invalid transfer.');
        }
        if (strict && (!profileIds.has(transfer.fromProfileId) || !profileIds.has(transfer.toProfileId) ||
            transfer.fromProfileId === transfer.toProfileId || !Number.isFinite(Number(transfer.amount)) ||
            Number(transfer.amount) <= 0 || !isValidISODate(transfer.date) ||
            typeof transfer.id !== 'string' || !transfer.id)) {
          throw new Error('Backup contains an incomplete or invalid transfer.');
        }
        return transfer;
      });
      const requestedActiveProfile = parsedBudget.activeProfileId || defaults.budget.activeProfileId;
      const activeProfileId = profileIds.has(requestedActiveProfile) ? requestedActiveProfile : fallbackProfileId;
      const requestedCurrency = typeof parsed.currency === 'string' ? parsed.currency : defaults.currency;
      const validCurrency = CURRENCY_OPTIONS.some(option => option.symbol === requestedCurrency);
      if (strict && !validCurrency) throw new Error('Backup contains an unsupported currency setting.');
      const currency = validCurrency ? requestedCurrency : defaults.currency;

      return {
        ...defaults,
        ...parsed,
        currency,
        customOptions: parsed.customOptions && typeof parsed.customOptions === 'object' && !Array.isArray(parsed.customOptions)
          ? parsed.customOptions
          : {},
        budget: {
          ...defaults.budget,
          ...parsedBudget,
          profiles,
          activeProfileId,
          transactions,
          transfers
        },
        period: { ...defaults.period, ...(parsed.period || {}) },
        activity: { ...defaults.activity, ...(parsed.activity || {}) },
        progress: { ...defaults.progress, ...(parsed.progress || {}) },
        entertainment
      };
    }

    function addCategoryOption(key, rawValue) {
      const group = CATEGORY_GROUPS[key];
      const value = String(rawValue ?? '').trim();
      if (!group || !value || value.length > 40) {
        showToast('Enter a category name up to 40 characters', 'warning');
        return false;
      }
      if (getCategoryOptions(key).some(option => option.toLowerCase() === value.toLowerCase())) {
        showToast('That option already exists', 'warning');
        return false;
      }
      if (!state.customOptions || typeof state.customOptions !== 'object' || Array.isArray(state.customOptions)) {
        state.customOptions = {};
      }
      const custom = Array.isArray(state.customOptions[key]) ? state.customOptions[key] : [];
      state.customOptions[key] = [...custom, value];
      saveState();
      showToast(`Option added to ${group.label.toLowerCase()}`, 'success');
      renderActiveView();
      return true;
    }

    function removeCategoryOption(key, value) {
      const group = CATEGORY_GROUPS[key];
      const custom = state.customOptions && state.customOptions[key];
      if (!group || group.defaults.includes(value) || !Array.isArray(custom) || !custom.includes(value)) {
        showToast('That custom option could not be removed', 'warning');
        return false;
      }
      state.customOptions[key] = custom.filter(option => option !== value);
      if (!state.customOptions[key].length) delete state.customOptions[key];
      if (key === 'entertainmentTypes' && uiState.entertainmentFilterType === value) uiState.entertainmentFilterType = 'all';
      if (key === 'entertainmentStatuses' && uiState.entertainmentFilterStatus === value) uiState.entertainmentFilterStatus = 'all';
      saveState();
      showToast(`Removed from ${group.label.toLowerCase()}`, 'success');
      renderActiveView();
      return true;
    }

    // =========================================================================
    // AUDIO SYNTHESIS (Web Audio API - no external audio files needed)
    // =========================================================================
    function getAudioCtx() {
      if (!runtime.audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) runtime.audioCtx = new AudioContext();
      }
      if (runtime.audioCtx && runtime.audioCtx.state === 'suspended') {
        runtime.audioCtx.resume().catch(() => {});
      }
      return runtime.audioCtx;
    }

    function playChimePattern() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const freqs = [587.33, 783.99, 987.77];
        freqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.14);
          gain.gain.setValueAtTime(0.001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.14 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.46);
        });
      } catch (e) {}
    }

    function startRingingLoop() {
      stopRingingLoop();
      playChimePattern();
      runtime.ringingIntervalId = setInterval(playChimePattern, 1800);
    }

    function renderEditorField(field) {
      const wrapperClass = field.wide ? 'sm:col-span-2' : '';
      const inputClass = 'w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm';
      const value = escapeHTML(field.value);
      const required = field.required ? 'required' : '';
      let control;

      if (field.type === 'select') {
        control = `<select name="${field.name}" class="${inputClass}" ${required}>
          ${field.options.map(option => `
            <option value="${escapeHTML(option.value)}" ${String(option.value) === String(field.value ?? '') ? 'selected' : ''}>${escapeHTML(option.label)}</option>
          `).join('')}
        </select>`;
      } else if (field.type === 'textarea') {
        control = `<textarea name="${field.name}" rows="${field.rows || 4}" class="${inputClass}" ${required}>${value}</textarea>`;
      } else if (field.type === 'checkbox') {
        control = `<label class="flex items-center gap-2 min-h-10 text-sm font-medium">
          <input name="${field.name}" type="checkbox" class="w-4 h-4 rounded text-indigo-600" ${field.value ? 'checked' : ''} />
          ${escapeHTML(field.checkboxLabel || field.label)}
        </label>`;
        return `<div class="${wrapperClass}">${control}</div>`;
      } else {
        control = `<input name="${field.name}" type="${field.type || 'text'}" value="${value}" class="${inputClass}"
          ${field.min !== undefined ? `min="${field.min}"` : ''}
          ${field.step !== undefined ? `step="${field.step}"` : ''}
          ${required} />`;
      }

      return `<label class="${wrapperClass} block text-xs font-semibold text-slate-500">
        <span class="block mb-1">${escapeHTML(field.label)}</span>
        ${control}
      </label>`;
    }

    function getBudgetStats() {
      const tx = state.budget.transactions;
      const income = tx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
      const expense = tx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
      const openingBalance = getBudgetProfiles().reduce((sum, profile) => sum + Number(profile.openingBalance || 0), 0);
      const balance = openingBalance + income - expense;
      const limit = Number(state.budget.monthlyLimit) || 0;
      const currentMonth = todayISO().slice(0, 7);
      const monthExpense = tx.filter(t => t.type === 'expense' && typeof t.date === 'string' && t.date.startsWith(currentMonth))
        .reduce((sum, t) => sum + Number(t.amount), 0);
      const limitUsedPct = limit > 0 ? Math.min(100, Math.round((monthExpense / limit) * 100)) : 0;
      return { income, expense, balance, limit, limitUsedPct, monthExpense };
    }

    function getBudgetProfiles() {
      return Array.isArray(state.budget.profiles) ? state.budget.profiles : [];
    }

    function getBudgetProfile(profileId) {
      return getBudgetProfiles().find(profile => profile.id === profileId);
    }

    function getVisibleBudgetTransactions() {
      return state.budget.transactions.filter(transaction =>
        uiState.budgetProfileId === 'all' || transaction.profileId === uiState.budgetProfileId
      );
    }

    function getProfileBalance(profileId) {
      const profile = getBudgetProfile(profileId);
      if (!profile) return 0;
      const transactionTotal = state.budget.transactions
        .filter(transaction => transaction.profileId === profileId)
        .reduce((balance, transaction) => balance + (transaction.type === 'income' ? 1 : -1) * Number(transaction.amount), 0);
      const transferTotal = state.budget.transfers.reduce((balance, transfer) => {
        if (transfer.toProfileId === profileId) return balance + Number(transfer.amount);
        if (transfer.fromProfileId === profileId) return balance - Number(transfer.amount);
        return balance;
      }, 0);
      return Number(profile.openingBalance || 0) + transactionTotal + transferTotal;
    }

    function formatMoney(amount) {
      const option = CURRENCY_OPTIONS.find(currency => currency.symbol === state.currency);
      const prefix = option && option.spaced ? `${state.currency} ` : state.currency;
      return `${prefix}${Number(amount || 0).toLocaleString(undefined, { maximumFractionDigits: 2 })}`;
    }

    function getPeriodPrediction() {
      const logs = [...state.period.logs].sort((a, b) => a.startDate.localeCompare(b.startDate));
      const cycleLen = Number(state.period.cycleLength) || 28;
      const periodLen = Number(state.period.periodLength) || 5;
      const today = todayISO();
      if (logs.length === 0) {
        return { lastStart: null, nextStart: null, daysUntil: null, cycleDay: null, fertileStart: null, fertileEnd: null, ovulationDay: null, periodLen, cycleLen };
      }
      const lastStart = logs[logs.length - 1].startDate;
      let nextStart = addDaysISO(lastStart, cycleLen);
      while (nextStart < today) {
        nextStart = addDaysISO(nextStart, cycleLen);
      }
      const daysUntil = diffDaysISO(today, nextStart);
      const cycleDay = diffDaysISO(lastStart, today) + 1;
      const ovulationDay = addDaysISO(nextStart, -14);
      const fertileStart = addDaysISO(ovulationDay, -4);
      const fertileEnd = addDaysISO(ovulationDay, 1);
      return { lastStart, nextStart, daysUntil, cycleDay, fertileStart, fertileEnd, ovulationDay, periodLen, cycleLen };
    }

    function getActivityStats() {
      const today = todayISO();
      const weekStart = addDaysISO(today, -6);
      const todayMins = state.activity.logs.filter(l => l.date === today).reduce((s, l) => s + Number(l.duration), 0);
      const weekLogs = state.activity.logs.filter(l => l.date >= weekStart && l.date <= today);
      const weekMins = weekLogs.reduce((s, l) => s + Number(l.duration), 0);
      const weekCalories = weekLogs.reduce((s, l) => s + Number(l.calories), 0);
      const goal = Number(state.activity.weeklyGoalMinutes) || 180;
      const pct = goal > 0 ? Math.min(100, Math.round((weekMins / goal) * 100)) : 0;
      return { todayMins, weekMins, weekCalories, goal, pct };
    }

    function getHabitStreak(habit) {
      const set = new Set(habit.history || []);
      let streak = 0;
      let cursor = todayISO();
      if (!set.has(cursor)) {
        cursor = addDaysISO(cursor, -1);
      }
      while (set.has(cursor)) {
        streak++;
        cursor = addDaysISO(cursor, -1);
      }
      return streak;
    }

    function formatTimerSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h > 0) return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function formatStopwatchMs(ms) {
      const totalCs = Math.floor(ms / 10);
      const cs = totalCs % 100;
      const totalSec = Math.floor(totalCs / 100);
      const s = totalSec % 60;
      const m = Math.floor(totalSec / 60) % 60;
      const h = Math.floor(totalSec / 3600);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
    }

    // =========================================================================
    // LIVE CLOCK, TIMER, STOPWATCH & ALARM ENGINE
    // =========================================================================
    function updateLiveClockAndAlarms() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateEl = document.getElementById('live-date-display');
      const clockEl = document.getElementById('live-clock-display');
      const badgeEl = document.getElementById('active-alarms-badge');
      if (dateEl) dateEl.textContent = dateStr;
      if (clockEl) clockEl.textContent = timeStr;
      const activeAlarms = state.alarms.filter(a => a.enabled).length;
      if (badgeEl) badgeEl.textContent = activeAlarms > 0 ? `${activeAlarms} alarm${activeAlarms > 1 ? 's' : ''} active` : 'No active alarms';

      // Update status pill if timer or stopwatch is running
      const pillTexts = [];
      if (runtime.timer.running) pillTexts.push(`Timer ${formatTimerSeconds(runtime.timer.remainingSeconds)}`);
      if (runtime.stopwatch.running) pillTexts.push(`SW ${formatStopwatchMs(runtime.stopwatch.elapsedMs).slice(0, 8)}`);

      const dPill = document.getElementById('desktop-time-pill');
      const mPill = document.getElementById('mobile-time-pill');
      const dText = document.getElementById('desktop-time-pill-text');
      const mText = document.getElementById('mobile-time-pill-text');
      if (pillTexts.length > 0) {
        const txt = pillTexts.join(' • ');
        if (dPill && dText) { dPill.classList.remove('hidden'); dPill.classList.add('inline-flex'); dText.textContent = txt; }
        if (mPill && mText) { mPill.classList.remove('hidden'); mPill.classList.add('inline-flex'); mText.textContent = txt; }
      } else {
        if (dPill) { dPill.classList.add('hidden'); dPill.classList.remove('inline-flex'); }
        if (mPill) { mPill.classList.add('hidden'); mPill.classList.remove('inline-flex'); }
      }

      // Update alarm live clock in Time view if visible
      const alarmBigClock = document.getElementById('alarm-big-clock');
      if (alarmBigClock) alarmBigClock.textContent = timeStr;

      // Check alarms at exact HH:MM match once per minute
      const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const minuteKey = `${todayISO()}_${hhmm}`;
      if (now.getSeconds() === 0 && runtime.lastTriggeredMinuteKey !== minuteKey) {
        const matched = state.alarms.filter(a => a.enabled && a.time === hhmm);
        if (matched.length > 0) {
          runtime.lastTriggeredMinuteKey = minuteKey;
          triggerAlarmModal(matched[0]);
        }
      }
    }

    function triggerAlarmModal(alarm) {
      startRingingLoop();
      openModal({
        title: `Alarm: ${alarm.label || alarm.time}`,
        body: `It's ${alarm.time}. Your scheduled alarm is ringing.`,
        icon: 'alarm-clock',
        actions: [
          {
            label: 'Snooze 5 min',
            className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-white hover:bg-amber-600 transition',
            onClick: () => {
              const snoozeDate = new Date(Date.now() + 5 * 60000);
              const snoozeTime = `${String(snoozeDate.getHours()).padStart(2, '0')}:${String(snoozeDate.getMinutes()).padStart(2, '0')}`;
              state.alarms.push({ id: uid(), time: snoozeTime, label: `${alarm.label || 'Alarm'} (Snoozed)`, enabled: true, repeat: 'Once' });
              saveState();
              if (state.activeTab === 'time') renderActiveView();
              showToast(`Snoozed until ${snoozeTime}`, 'info');
            }
          },
          {
            label: 'Dismiss',
            className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition',
            onClick: () => {
              if (alarm.repeat === 'Once') {
                alarm.enabled = false;
                saveState();
                if (state.activeTab === 'time') renderActiveView();
              }
            }
          }
        ]
      });
    }

    function startTimer() {
      if (runtime.timer.running) return;
      if (runtime.timer.remainingSeconds <= 0) {
        runtime.timer.remainingSeconds = runtime.timer.totalSeconds;
      }
      getAudioCtx();
      runtime.timer.running = true;
      if (runtime.timer.intervalId) clearInterval(runtime.timer.intervalId);
      runtime.timer.intervalId = setInterval(() => {
        runtime.timer.remainingSeconds--;
        updateTimerDOM();
        if (runtime.timer.remainingSeconds <= 0) {
          pauseTimer();
          startRingingLoop();
          openModal({
            title: 'Timer Complete!',
            body: 'Your countdown timer has finished.',
            icon: 'timer',
            actions: [
              {
                label: 'Stop & Reset',
                className: 'px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition',
                onClick: () => {
                  runtime.timer.remainingSeconds = runtime.timer.totalSeconds;
                  updateTimerDOM();
                }
              }
            ]
          });
        }
      }, 1000);
      updateTimerDOM();
    }

    function pauseTimer() {
      runtime.timer.running = false;
      if (runtime.timer.intervalId) {
        clearInterval(runtime.timer.intervalId);
        runtime.timer.intervalId = null;
      }
      updateTimerDOM();
    }

    function resetTimer() {
      pauseTimer();
      runtime.timer.remainingSeconds = runtime.timer.totalSeconds;
      updateTimerDOM();
    }

    function updateTimerDOM() {
      const readout = document.getElementById('timer-readout');
      const ring = document.getElementById('timer-ring-progress');
      const toggleBtn = document.getElementById('timer-toggle-btn');
      if (readout) readout.textContent = formatTimerSeconds(runtime.timer.remainingSeconds);
      if (ring) {
        const circumference = 2 * Math.PI * 88;
        const pct = runtime.timer.totalSeconds > 0 ? runtime.timer.remainingSeconds / runtime.timer.totalSeconds : 0;
        ring.style.strokeDasharray = `${circumference}`;
        ring.style.strokeDashoffset = `${circumference * (1 - pct)}`;
      }
      if (toggleBtn) {
        toggleBtn.textContent = runtime.timer.running ? 'Pause' : 'Start';
      }
    }

    function startStopwatch() {
      if (runtime.stopwatch.running) return;
      runtime.stopwatch.running = true;
      runtime.stopwatch.lastTick = performance.now();
      if (runtime.stopwatch.rafId) cancelAnimationFrame(runtime.stopwatch.rafId);
      const tick = (now) => {
        if (!runtime.stopwatch.running) return;
        runtime.stopwatch.elapsedMs += (now - runtime.stopwatch.lastTick);
        runtime.stopwatch.lastTick = now;
        const readout = document.getElementById('stopwatch-readout');
        if (readout) readout.textContent = formatStopwatchMs(runtime.stopwatch.elapsedMs);
        runtime.stopwatch.rafId = requestAnimationFrame(tick);
      };
      runtime.stopwatch.rafId = requestAnimationFrame(tick);
      if (state.activeTab === 'time' && uiState.timeSubTab === 'stopwatch') renderTimeToolsSection();
    }

    function pauseStopwatch() {
      runtime.stopwatch.running = false;
      if (runtime.stopwatch.rafId) {
        cancelAnimationFrame(runtime.stopwatch.rafId);
        runtime.stopwatch.rafId = null;
      }
      if (state.activeTab === 'time' && uiState.timeSubTab === 'stopwatch') renderTimeToolsSection();
    }

    function resetStopwatch() {
      pauseStopwatch();
      runtime.stopwatch.elapsedMs = 0;
      runtime.stopwatch.laps = [];
      if (state.activeTab === 'time' && uiState.timeSubTab === 'stopwatch') renderTimeToolsSection();
    }

              <div class="text-2xl font-bold text-rose-600 dark:text-rose-400 mt-2 tabular-nums">${formatMoney(stats.expense)}</div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <div class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Net Balance</div>
              <div class="text-2xl font-bold mt-2 tabular-nums ${stats.balance >= 0 ? 'text-slate-900 dark:text-white' : 'text-rose-600'}">${formatMoney(stats.balance)}</div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
              <span class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Monthly Limit</span>
              <div class="flex items-center gap-2 mt-2">
                <input id="budget-limit-input" type="number" min="0" value="${stats.limit}" class="w-28 text-lg font-bold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-0.5 tabular-nums" />
                <button id="save-limit-btn" class="text-xs px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Set</button>
              </div>
              <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full mt-3 overflow-hidden">
                <div class="h-full rounded-full ${stats.limitUsedPct > 90 ? 'bg-rose-500' : 'bg-emerald-500'}" style="width: ${stats.limitUsedPct}%"></div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Add Transaction Form -->
            <form id="budget-form" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
              <h3 class="font-bold text-base">Add Transaction</h3>
              <div class="grid grid-cols-2 gap-2">
                <label class="cursor-pointer">
                  <input type="radio" name="tx-type" value="expense" checked class="peer sr-only" />
                  <div class="text-center py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold peer-checked:bg-rose-50 peer-checked:border-rose-500 peer-checked:text-rose-700 dark:peer-checked:bg-rose-950/60 dark:peer-checked:text-rose-300 transition">Expense</div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="tx-type" value="income" class="peer sr-only" />
                  <div class="text-center py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 dark:peer-checked:bg-emerald-950/60 dark:peer-checked:text-emerald-300 transition">Income</div>
                </label>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Profile</label>
                <select id="tx-profile" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  ${getBudgetProfiles().map(profile => `<option value="${escapeHTML(profile.id)}" ${profile.id === (uiState.budgetProfileId === 'all' ? state.budget.activeProfileId : uiState.budgetProfileId) ? 'selected' : ''}>${escapeHTML(profile.name)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Amount (${state.currency})</label>
                <input id="tx-amount" type="number" step="0.01" min="0.01" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Category</label>
                  <select id="tx-category" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                    ${categories.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Date</label>
                  <input id="tx-date" type="date" value="${escapeHTML(uiState.budgetEntryDate || todayISO())}" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Payment Method</label>
                <select id="tx-payment-method" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  ${paymentMethods.map(method => `<option value="${escapeHTML(method)}" ${method === 'UPI' ? 'selected' : ''}>${escapeHTML(method)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Description</label>
                <input id="tx-desc" type="text" required placeholder="e.g., Grocery run" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition">Add Transaction</button>
            </form>

            <!-- Expense Breakdown Chart -->
            <div class="lg:col-span-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col">
              <h3 class="font-bold text-base mb-4">Expense Breakdown by Category</h3>
              <div class="relative h-64 flex-1">
                <canvas id="budget-chart"></canvas>
              </div>
            </div>
          </div>

          <!-- Transactions Table -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <h3 class="font-bold text-base">Transactions (${filtered.length})</h3>
              <div class="flex flex-wrap items-center gap-2">
                <input id="budget-search" type="text" value="${escapeHTML(uiState.budgetSearch)}" placeholder="Search..." class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" />
                <select id="budget-filter-type" class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  <option value="all" ${uiState.budgetFilterType === 'all' ? 'selected' : ''}>All Types</option>
                  <option value="expense" ${uiState.budgetFilterType === 'expense' ? 'selected' : ''}>Expenses</option>
                  <option value="income" ${uiState.budgetFilterType === 'income' ? 'selected' : ''}>Income</option>
                </select>
                <select id="budget-filter-cat" class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm">
                  <option value="all">All Categories</option>
                  ${categories.map(c => `<option value="${escapeHTML(c)}" ${uiState.budgetFilterCategory === c ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead class="text-xs uppercase text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                  <tr>
                    <th class="py-2.5 pr-4">Date</th>
                    <th class="py-2.5 pr-4">Description</th>
                    <th class="py-2.5 pr-4">Profile</th>
                    <th class="py-2.5 pr-4">Category</th>
                    <th class="py-2.5 pr-4">Payment Method</th>
                    <th class="py-2.5 pr-4 text-right">Amount</th>
                    <th class="py-2.5 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${filtered.map(t => `
                    <tr>
                      <td class="py-3 pr-4 text-slate-500 dark:text-slate-400 tabular-nums whitespace-nowrap">${escapeHTML(t.date)}</td>
                      <td class="py-3 pr-4 font-medium">${escapeHTML(t.desc)}</td>
                      <td class="py-3 pr-4 text-slate-500 dark:text-slate-400 whitespace-nowrap">${escapeHTML((getBudgetProfile(t.profileId) || {}).name || 'Personal')}</td>
                      <td class="py-3 pr-4"><span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 dark:bg-slate-800">${escapeHTML(t.category)}</span></td>
                      <td class="py-3 pr-4 text-slate-500 dark:text-slate-400 whitespace-nowrap">${escapeHTML(t.paymentMethod || 'Not specified')}</td>
                      <td class="py-3 pr-4 text-right font-semibold tabular-nums ${t.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
                        ${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}
                      </td>
                      <td class="py-3 text-right">
                        <div class="flex justify-end gap-1">
                          <button data-edit-tx="${escapeHTML(t.id)}" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg transition" aria-label="Edit transaction">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                          </button>
                          <button data-del-tx="${escapeHTML(t.id)}" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition" aria-label="Delete transaction">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  `).join('') || '<tr><td colspan="7" class="py-6 text-center text-slate-500">No matching transactions.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      // Bindings
      document.getElementById('save-limit-btn').addEventListener('click', () => {
        const val = Number(document.getElementById('budget-limit-input').value);
        if (val >= 0) {
          if (selectedProfile) selectedProfile.monthlyLimit = val;
          else state.budget.monthlyLimit = val;
          saveState();
          renderActiveView();
          showToast('Monthly budget limit updated', 'success');
        }
      });

      document.getElementById('budget-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const type = document.querySelector('input[name="tx-type"]:checked').value;
        const amount = parseFloat(document.getElementById('tx-amount').value);
        const category = document.getElementById('tx-category').value;
        const paymentMethod = document.getElementById('tx-payment-method').value;
        const profileId = document.getElementById('tx-profile').value;
        const date = document.getElementById('tx-date').value;
        const desc = document.getElementById('tx-desc').value.trim();
        if (!Number.isFinite(amount) || amount <= 0 || !desc || !isValidISODate(date) || !getBudgetProfile(profileId)) {
          showToast('Enter a valid amount, date, profile, and description', 'warning');
          return;
        }
        state.budget.transactions.push({ id: uid(), type, amount, category, paymentMethod, profileId, date, desc });
        uiState.budgetEntryDate = null;
        saveState();
        renderActiveView();
        showToast('Transaction added', 'success');
      });

      document.getElementById('budget-search').addEventListener('input', (e) => {
        uiState.budgetSearch = e.target.value;
        renderActiveView();
      });
      document.getElementById('budget-filter-type').addEventListener('change', (e) => {
        uiState.budgetFilterType = e.target.value;
        renderActiveView();
      });
      document.getElementById('budget-filter-cat').addEventListener('change', (e) => {
        uiState.budgetFilterCategory = e.target.value;
        renderActiveView();
      });

      container.querySelectorAll('[data-edit-tx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const transaction = state.budget.transactions.find(t => t.id === btn.getAttribute('data-edit-tx'));
          if (!transaction) return;
          const transactionCategories = [...getCategoryOptions('budgetCategories')];
          if (transaction.category && !transactionCategories.includes(transaction.category)) {
            transactionCategories.push(transaction.category);
          }
          const currentPaymentMethods = getCategoryOptions('paymentMethods');
          const methodOptions = [{ value: '', label: 'Not specified' }, ...currentPaymentMethods.map(method => ({ value: method, label: method }))];
          if (transaction.paymentMethod && !currentPaymentMethods.includes(transaction.paymentMethod)) {
            methodOptions.push({ value: transaction.paymentMethod, label: transaction.paymentMethod });
          }
          openRecordEditor('Edit Transaction', [
            { name: 'type', label: 'Type', type: 'select', value: transaction.type, options: [{ value: 'expense', label: 'Expense' }, { value: 'income', label: 'Income' }] },
            { name: 'amount', label: `Amount (${state.currency})`, type: 'number', value: transaction.amount, min: 0.01, step: 0.01, required: true },
            { name: 'profileId', label: 'Profile', type: 'select', value: transaction.profileId, options: getBudgetProfiles().map(profile => ({ value: profile.id, label: profile.name })) },
            { name: 'category', label: 'Category', type: 'select', value: transaction.category, options: transactionCategories.map(category => ({ value: category, label: category })) },
            { name: 'paymentMethod', label: 'Payment Method', type: 'select', value: transaction.paymentMethod || '', options: methodOptions },
            { name: 'date', label: 'Date', type: 'date', value: transaction.date, required: true },
            { name: 'desc', label: 'Description', value: transaction.desc, wide: true, required: true }
          ], values => {
            transaction.type = values.type;
            transaction.amount = Number(values.amount);
            transaction.profileId = values.profileId;
            transaction.category = values.category;
            transaction.paymentMethod = values.paymentMethod;
            transaction.date = values.date;
            transaction.desc = values.desc.trim();
            saveState();
            renderActiveView();
            showToast('Transaction updated', 'success');
          });
        });
      });

      container.querySelectorAll('[data-del-tx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-tx');
          state.budget.transactions = state.budget.transactions.filter(t => t.id !== id);
          saveState();
          renderActiveView();
          showToast('Transaction removed', 'info');
        });
      });

      // Render Chart.js Doughnut
      const expenseByCat = {};
      transactions.filter(t => t.type === 'expense').forEach(t => {
        expenseByCat[t.category] = (expenseByCat[t.category] || 0) + Number(t.amount);
      });
      const labels = Object.keys(expenseByCat);
      const dataVals = Object.values(expenseByCat);
      const canvas = document.getElementById('budget-chart');
      if (canvas && window.Chart) {
        runtime.charts.budget = new Chart(canvas, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['No Expenses'],
            datasets: [{
              data: dataVals.length ? dataVals : [1],
              backgroundColor: labels.length
                ? ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#8b5cf6', '#06b6d4', '#64748b']
                : ['#e2e8f0'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'right', labels: { color: state.theme === 'dark' ? '#cbd5e1' : '#334155', boxWidth: 12 } }
            }
          }
        });
      }
    }

    function renderBudgetCalendar(container) {
      const monthDate = new Date(new Date().getFullYear(), new Date().getMonth() + uiState.budgetCalendarOffset, 1);
      const year = monthDate.getFullYear();
      const month = monthDate.getMonth();
      const monthTitle = monthDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstWeekday = new Date(year, month, 1).getDay();
      const transactions = getVisibleBudgetTransactions();
      const selectedDate = uiState.budgetSelectedDate || todayISO();
      const dailyTotals = new Map();
      transactions.forEach(transaction => {
        const total = dailyTotals.get(transaction.date) || { income: 0, expense: 0 };
        total[transaction.type] += Number(transaction.amount);
        dailyTotals.set(transaction.date, total);
      });
      const cells = Array.from({ length: firstWeekday + daysInMonth }, (_, index) => {
        if (index < firstWeekday) return '<div aria-hidden="true"></div>';
        const day = index - firstWeekday + 1;
        const date = formatDateISO(new Date(year, month, day));
        const totals = dailyTotals.get(date) || { income: 0, expense: 0 };
        const isSelected = date === selectedDate;
        return `
          <button type="button" data-budget-calendar-date="${date}" aria-label="${escapeHTML(date)}: ${formatMoney(totals.expense)} expenses, ${formatMoney(totals.income)} income" class="min-h-20 sm:min-h-24 rounded-xl border p-1.5 text-left flex flex-col ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-200 dark:ring-indigo-900' : 'border-slate-200 dark:border-slate-700'} ${date === todayISO() ? 'bg-indigo-50/70 dark:bg-indigo-950/30' : 'bg-white dark:bg-slate-900'}">
            <span class="text-xs font-semibold">${day}</span>
            ${totals.expense ? `<span class="mt-1 text-[10px] leading-tight text-rose-600">${formatMoney(totals.expense)}</span>` : ''}
            ${totals.income ? `<span class="text-[10px] leading-tight text-emerald-600">${formatMoney(totals.income)}</span>` : ''}
          </button>
        `;
      });
      while (cells.length % 7) cells.push('<div aria-hidden="true"></div>');
      const dayTransactions = transactions.filter(transaction => transaction.date === selectedDate)
        .sort((a, b) => a.type.localeCompare(b.type));
      const dayTransfers = state.budget.transfers.filter(transfer =>
        transfer.date === selectedDate &&
        (uiState.budgetProfileId === 'all' || transfer.fromProfileId === uiState.budgetProfileId || transfer.toProfileId === uiState.budgetProfileId)
      );
      const totals = dayTransactions.reduce((sum, transaction) => {
        sum[transaction.type] += Number(transaction.amount);
        return sum;
      }, { income: 0, expense: 0 });

      container.innerHTML = `
        <div class="space-y-4">
          <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm">
            <div class="flex items-center justify-between gap-3 mb-4">
              <button type="button" id="budget-calendar-prev" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Previous month"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
              <h3 class="font-bold">${escapeHTML(monthTitle)}</h3>
              <div class="flex items-center gap-1">
                <button type="button" id="budget-calendar-today" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800">Today</button>
                <button type="button" id="budget-calendar-next" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Next month"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-semibold text-slate-400 mb-1">
              ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `<div>${day}</div>`).join('')}
            </div>
            <div class="grid grid-cols-7 gap-1.5">${cells.join('')}</div>
            <p class="mt-3 text-xs text-slate-500">Each date shows income and expenses for the selected profile.</p>
          </section>
          <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3">
              <div>
                <h3 class="font-bold">${escapeHTML(new Date(`${selectedDate}T00:00:00`).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }))}</h3>
                <p class="text-xs text-slate-500 mt-1">${dayTransactions.length} transaction${dayTransactions.length === 1 ? '' : 's'} · ${dayTransfers.length} transfer${dayTransfers.length === 1 ? '' : 's'}</p>
              </div>
              <div class="flex gap-3 text-xs font-semibold">
                <span class="text-emerald-600">In ${formatMoney(totals.income)}</span>
                <span class="text-rose-600">Out ${formatMoney(totals.expense)}</span>
              </div>
            </div>
            <div class="divide-y divide-slate-100 dark:divide-slate-800">
              ${dayTransactions.map(transaction => `
                <div class="py-3 flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <div class="font-medium text-sm truncate">${escapeHTML(transaction.desc)}</div>
                    <div class="text-xs text-slate-500 mt-0.5">${escapeHTML(transaction.category || 'Other')} · ${escapeHTML(transaction.paymentMethod || 'Not specified')} · ${escapeHTML((getBudgetProfile(transaction.profileId) || {}).name || 'Personal')}</div>
                  </div>
                  <div class="shrink-0 text-sm font-semibold ${transaction.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">${transaction.type === 'income' ? '+' : '−'}${formatMoney(transaction.amount)}</div>
                </div>
              `).join('') || '<p class="py-5 text-sm text-center text-slate-500">No transactions on this date.</p>'}
              ${dayTransfers.map(transfer => `
                <div class="py-3 flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <div class="font-medium text-sm">${escapeHTML(transfer.desc || 'Profile transfer')}</div>
                    <div class="text-xs text-slate-500 mt-0.5">${escapeHTML((getBudgetProfile(transfer.fromProfileId) || {}).name || 'Unknown')} → ${escapeHTML((getBudgetProfile(transfer.toProfileId) || {}).name || 'Unknown')}</div>
                  </div>
                  <div class="shrink-0 text-sm font-semibold text-indigo-600">${formatMoney(transfer.amount)}</div>
                </div>
              `).join('')}
            </div>
            <button type="button" data-budget-goto-view="overview" class="mt-3 px-3 py-2 rounded-lg bg-indigo-600 text-white text-xs font-semibold">Add a transaction</button>
          </section>
        </div>
      `;

      const changeCalendarMonth = offset => {
        const selectedDay = Number(uiState.budgetSelectedDate.slice(8, 10)) || 1;
        const nextMonth = new Date(year, month + offset, 1);
        const lastDay = new Date(nextMonth.getFullYear(), nextMonth.getMonth() + 1, 0).getDate();
        uiState.budgetCalendarOffset += offset;
        uiState.budgetSelectedDate = formatDateISO(new Date(nextMonth.getFullYear(), nextMonth.getMonth(), Math.min(selectedDay, lastDay)));
        renderActiveView();
      };
      document.getElementById('budget-calendar-prev').addEventListener('click', () => changeCalendarMonth(-1));
      document.getElementById('budget-calendar-next').addEventListener('click', () => changeCalendarMonth(1));
      document.getElementById('budget-calendar-today').addEventListener('click', () => {
        uiState.budgetCalendarOffset = 0;
        uiState.budgetSelectedDate = todayISO();
        renderActiveView();
      });
      container.querySelectorAll('[data-budget-calendar-date]').forEach(button => {
        button.addEventListener('click', () => {
          uiState.budgetSelectedDate = button.getAttribute('data-budget-calendar-date');
          renderActiveView();
        });
      });
      container.querySelector('[data-budget-goto-view]').addEventListener('click', () => {
        uiState.budgetView = 'overview';
        uiState.budgetEntryDate = selectedDate;
        document.querySelector('[data-nav-id="budget"]').click();
      });
    }

    function renderBudgetReports(container) {
      const mode = uiState.budgetReportMode;
      let startDate = '';
      let endDate = '';
      if (mode === 'month') {
        const month = uiState.budgetReportDate.slice(0, 7);
        startDate = `${month}-01`;
        const [year, monthNumber] = month.split('-').map(Number);

    // -------------------------------------------------------------------------
    // 2. PERIOD TRACKER
    // -------------------------------------------------------------------------
    function getPeriodDailyDetails(log) {
      if (!log) return [];
      const startDate = log.startDate;
      if (!startDate) return [];
      const fallbackLength = Number(state.period.periodLength) || 5;
      const endDate = log.endDate || addDaysISO(startDate, fallbackLength - 1);
      const dayCount = diffDaysISO(startDate, endDate) + 1;
      if (!startDate || dayCount < 1 || dayCount > 31) return [];

      const hasDailyDetails = Array.isArray(log.dailyDetails);
      const byDate = new Map(
        (hasDailyDetails ? log.dailyDetails : [])
          .filter(detail => detail && typeof detail.date === 'string')
          .map(detail => [detail.date, detail])
      );
      const legacySymptoms = Array.isArray(log.symptoms) ? log.symptoms : [];
      const legacyFlow = typeof log.flow === 'string' && log.flow ? log.flow : 'Medium';

      return Array.from({ length: dayCount }, (_, index) => {
        const date = addDaysISO(startDate, index);
        const detail = byDate.get(date);
        return {
          date,
          flow: detail && typeof detail.flow === 'string' && detail.flow ? detail.flow : legacyFlow,
          symptoms: detail && Array.isArray(detail.symptoms) ? detail.symptoms.filter(value => typeof value === 'string') : legacySymptoms,
          notes: detail && typeof detail.notes === 'string' ? detail.notes : (!hasDailyDetails && index === 0 ? (log.notes || '') : '')
        };
      });
    }

    function renderPeriodDayFields(startDate, endDate, existingDetails, symptomsList) {
      if (!startDate || !endDate) {
        return '<p class="text-sm text-rose-600">Choose a start and end date.</p>';
      }
      const dayCount = diffDaysISO(startDate, endDate) + 1;
      if (dayCount < 1) {
        return '<p class="text-sm text-rose-600">Choose an end date on or after the start date.</p>';
      }
      if (dayCount > 31) {
        return '<p class="text-sm text-rose-600">A period log can include up to 31 days. Please shorten the date range.</p>';
      }

      const byDate = new Map(existingDetails.map(detail => [detail.date, detail]));
      const flowOptions = getCategoryOptions('periodFlows');
      return Array.from({ length: dayCount }, (_, index) => {
        const date = addDaysISO(startDate, index);
        const detail = byDate.get(date) || { flow: 'Medium', symptoms: [], notes: '' };
        const detailFlow = typeof detail.flow === 'string' && detail.flow ? detail.flow : (flowOptions[0] || 'Medium');
        const dayFlowOptions = flowOptions.includes(detailFlow) ? flowOptions : [detailFlow, ...flowOptions];
        const daySymptoms = [...new Set([
          ...symptomsList,
          ...(Array.isArray(detail.symptoms) ? detail.symptoms.filter(symptom => typeof symptom === 'string') : [])
        ])];
        const dayLabel = new Date(`${date}T00:00:00`).toLocaleDateString(undefined, {
          weekday: 'long',
          month: 'short',
          day: 'numeric'
        });
        return `
          <section data-period-day="${date}" class="rounded-xl border border-slate-200 dark:border-slate-700 p-3 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <h4 class="text-sm font-semibold">${escapeHTML(dayLabel)}</h4>
              <select data-period-flow class="px-2 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm" aria-label="Flow for ${escapeHTML(dayLabel)}">
                ${dayFlowOptions.map(flow => `<option value="${escapeHTML(flow)}" ${detailFlow === flow ? 'selected' : ''}>${escapeHTML(flow)}</option>`).join('')}
              </select>
            </div>
            <div>
              <div class="text-xs font-semibold text-slate-500 mb-1.5">Symptoms</div>
              <div class="flex flex-wrap gap-1.5">
                ${daySymptoms.map(symptom => `
                  <label class="cursor-pointer">
                    <input type="checkbox" data-period-symptom value="${escapeHTML(symptom)}" ${(detail.symptoms || []).includes(symptom) ? 'checked' : ''} class="peer sr-only" />
                    <span class="inline-block px-2.5 py-1 rounded-full text-xs font-medium border border-slate-200 dark:border-slate-700 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition">${escapeHTML(symptom)}</span>
